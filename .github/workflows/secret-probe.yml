name: Secret Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then echo "SECRET_PRESENT length=${#DISCORD_WEBHOOK_URL}"; else echo "SECRET_EMPTY"; fi
